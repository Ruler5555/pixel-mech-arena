# PIXEL MECH ARENA · coturn TURN 服务器配置
# 部署前请修改以下三处:
#   external-ip        -> 你的服务器公网 IP
#   relay-ip           -> 你的服务器内网 IP(单网卡可注释掉此行)
#   static-auth-secret -> 改成一段足够随机的长字符串(可用 `openssl rand -hex 32` 生成)
#
# 防火墙需放行的端口:
#   3478/udp, 3478/tcp      (TURN 中继主端口)
#   5349/tcp                (可选, TLS)
#   49152-65535/udp         (中继数据端口范围, 由 min-port/max-port 指定)
listening-port=3478
listening-ip=0.0.0.0
# relay-ip=10.0.0.5
external-ip=YOUR_PUBLIC_IP
min-port=49152
max-port=65535
fingerprint
use-auth-secret
static-auth-secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET
realm=pixel-mech-arena
total-quota=100
bps-capacity=0
stale-nonce=600
